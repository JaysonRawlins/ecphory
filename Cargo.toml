[package]
name = "ecphory"
version = "0.3.5"
edition = "2024"
description = "Recall, measured. A single-binary, lexical-first memory store for AI agents."
license = "MIT"
repository = "https://github.com/JaysonRawlins/ecphory"
homepage = "https://github.com/JaysonRawlins/ecphory"
keywords = ["memory", "mcp", "bm25", "agent", "search"]
categories = ["command-line-utilities", "database-implementations"]

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
redb = "4.1.0"
rmcp = { version = "2.2.0", features = ["schemars", "server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tantivy = "0.26.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
