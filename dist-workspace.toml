[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap the formula is published to (publish job enabled at
# public-flip: add "homebrew" to publish-jobs + HOMEBREW_TAP_TOKEN secret;
# until then the formula is only generated as a release artifact)
tap = "JaysonRawlins/homebrew-tap"
# Linux is musl-only on purpose: one static binary, no glibc floor
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Archive format for macOS/Linux artifacts. Deliberately .tar.gz, NOT the
# dist default .tar.xz: the generated installer's preflight checks for `tar`
# but never for `xz`, so on any image with tar-but-no-xz (debian-slim,
# ubuntu) `curl | sh` died with "tar (child): xz: Cannot exec". gzip is
# present on those images where xz is not. Costs a couple of MiB per
# artifact; buys an install that works on a stock minimal Linux.
unix-archive = ".tar.gz"
